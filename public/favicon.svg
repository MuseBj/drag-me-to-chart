<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="border-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="bar-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="bar-indigo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="bar-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Area Chart Gradient -->
    <linearGradient id="trend-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Dashboard Frame / Squircle Base -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="10" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Top Dashboard Bar / Mini Nav & Controls -->
  <!-- Top Left: Donut Chart / Radial Dial -->
  <circle cx="12" cy="13" r="5" fill="none" stroke="#1e293b" stroke-width="2" />
  <circle cx="12" cy="13" r="5" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="18 14" stroke-dashoffset="6" stroke-linecap="round" />
  <circle cx="12" cy="13" r="5" fill="none" stroke="#ff007f" stroke-width="2" stroke-dasharray="8 24" stroke-dashoffset="24" stroke-linecap="round" />
  <circle cx="12" cy="13" r="1.5" fill="#f8fafc" />

  <!-- Top Right: Stat Value Lines -->
  <rect x="22" y="10" width="18" height="2.5" rx="1.25" fill="#f8fafc" opacity="0.9" />
  <rect x="22" y="14" width="11" height="2" rx="1" fill="#38bdf8" opacity="0.75" />

  <!-- Subtle Horizontal Grid Divider -->
  <line x1="6" y1="20" x2="42" y2="20" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" opacity="0.5" />

  <!-- Bottom Chart Area: 4 Ascending Analytics Bars -->
  <!-- Axis Line -->
  <line x1="7" y1="40" x2="41" y2="40" stroke="#334155" stroke-width="1.5" stroke-linecap="round" />

  <!-- Bars with Rounded Tops -->
  <!-- Bar 1 (Short) -->
  <rect x="9" y="31" width="5.5" height="8" rx="1.5" fill="url(#bar-cyan)" />
  <!-- Bar 2 (Medium-Low) -->
  <rect x="17" y="25" width="5.5" height="14" rx="1.5" fill="url(#bar-blue)" />
  <!-- Bar 3 (Medium-High) -->
  <rect x="25" y="19" width="5.5" height="20" rx="1.5" fill="url(#bar-indigo)" />
  <!-- Bar 4 (Peak) -->
  <rect x="33" y="13" width="5.5" height="26" rx="1.5" fill="url(#bar-purple)" />

  <!-- Trend Line Sweeping Over the Bars -->
  <path d="M 8 33 Q 16 26 24 21 T 39 10" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Summit Growth Indicator Dot -->
  <circle cx="39" cy="10" r="2.2" fill="#ffffff" stroke="#22c55e" stroke-width="1.5" />
</svg>